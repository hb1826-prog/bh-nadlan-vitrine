:root{--fond:#FAF7F1;--surface:#FFFFFF;--creux:#F4F0E7;--encre:#0F172A;
--encre2:#333B4D;--gris:#5A6172;--trait:#E7E2D8;--trait-doux:#F1EDE4;
--action:#0B6BD6;--action-vive:#0A57AE;--action-lavis:#EAF3FE;
--action-trait:#BBD9F8;--or:#C9A227;--or-lavis:#FBF5E4;--or-trait:#E6D9B0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font-family:'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:17px;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:3px solid var(--or);
 padding:12px 20px 14px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.haut{display:flex;align-items:center;gap:18px;max-width:1700px;margin:0 auto}
.haut img{height:64px;width:auto;flex:none}
.cherche{flex:1;position:relative}
.cherche input{width:100%;font:inherit;font-size:26px;padding:14px 52px 14px 20px;border:2px solid var(--trait);
 border-radius:14px;background:var(--surface);color:var(--encre);outline:none}
.cherche input:focus{border-color:var(--action);box-shadow:0 0 0 4px var(--action-lavis)}
.cherche button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--creux);
 color:var(--encre2);font-size:22px;width:40px;height:40px;border-radius:10px;cursor:pointer;display:none}
.compteur{max-width:1700px;margin:10px auto 0;font-size:20px;font-weight:600;color:var(--encre2);min-height:28px}
main{max-width:1700px;margin:0 auto;padding:16px 20px 60px}
.villes{display:flex;flex-wrap:wrap;gap:10px}
.villes button{font:inherit;font-size:18px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--action-trait);
 background:var(--surface);color:var(--action);cursor:pointer;font-weight:500}
.villes button:hover{background:var(--action-lavis);border-color:var(--action)}
.villes button span{color:var(--gris);font-weight:400;margin-left:6px}
.titre-villes{font-size:18px;color:var(--gris);margin:4px 0 14px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--trait);
 border-radius:14px}
th:first-child{border-top-left-radius:13px}th:last-child{border-top-right-radius:13px}
th{position:sticky;top:var(--haut,150px);background:var(--encre);color:#fff;text-align:left;font-weight:600;
 font-size:15px;padding:12px 12px;white-space:nowrap;z-index:2}
td{padding:14px 12px;border-top:1px solid var(--trait-doux);vertical-align:top;font-size:17px}
tr:nth-child(even) td{background:#FFFDF8}
td.nom{font-weight:700;font-size:19px}
td.ville{white-space:nowrap}
td.prix div,td.prox div{white-space:nowrap}
td.prix div{font-weight:600}
td.liv{min-width:120px}
a.fiche{display:inline-block;white-space:nowrap;background:var(--action);color:#fff;text-decoration:none;
 font-weight:600;padding:9px 14px;border-radius:10px;font-size:16px}
a.fiche:hover{background:var(--action-vive)}
.vide{font-size:20px;color:var(--gris);padding:30px 0}
.pied{max-width:1700px;margin:0 auto;padding:0 20px 30px;color:var(--gris);font-size:14px}
.cartes{display:none}
.porte{position:fixed;inset:0;z-index:50;background:var(--fond);display:flex;align-items:center;justify-content:center;padding:20px}
.porte[hidden]{display:none}
.porte form{background:var(--surface);border:1px solid var(--trait);border-top:4px solid var(--or);border-radius:16px;padding:28px 26px;
 width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:14px}
.porte img{height:80px;width:auto;margin:0 auto}
.porte label{font-size:20px;font-weight:600}
.porte input{font:inherit;font-size:34px;letter-spacing:12px;text-align:center;padding:10px;border:2px solid var(--trait);border-radius:12px}
.porte input:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 4px var(--action-lavis)}
.porte button{font:inherit;font-size:20px;font-weight:600;padding:12px;border:0;border-radius:12px;background:var(--action);color:#fff;cursor:pointer}
.porte p{margin:0;min-height:22px;color:#B4321F}
@media (max-width:1100px){
 table{display:none}
 .cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
 .carte{background:var(--surface);border:1px solid var(--trait);border-left:5px solid var(--or);border-radius:14px;padding:16px 16px 14px}
 .carte h3{margin:0 0 2px;font-size:21px}
 .carte .lieu{color:var(--encre2);margin-bottom:10px}
 .carte dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
 .carte dt{color:var(--gris);font-size:14px;padding-top:2px}
 .carte dd{margin:0}
 .carte .prix div{font-weight:600}
 .carte a.fiche{margin-top:12px}
}
@media (max-width:600px){
 body{font-size:16px}
 header{padding:10px 12px 10px}
 .haut{gap:10px}
 .haut img{height:44px}
 .cherche input{font-size:20px;padding:12px 46px 12px 14px}
 .compteur{font-size:17px}
 main{padding:12px 12px 50px}
 .cartes{grid-template-columns:1fr}
 .villes button{font-size:16px;padding:9px 13px}
}
</style></head>

<script>

const COFFRE=null;
const PROTEGE=true,URL_D="https://espace.bh-nadlan.com/salon/donnees",CLE_CODE="bh-listing-salon-code";
const A={"Jérusalem":["Jérusalem","Yerushalayim","Yeroushalaim","Yerouchalayim","Jerushalaim","JLM","ירושלים","Jerusalem"],"Tel Aviv":["Tel-Aviv","Tel Aviv-Yafo","TLV","Tel Avive","Jaffa","Yafo","תל אביב"],"Rishon LeZion":["Richon LeZion","Rishon Letsion","Rishon Lezion","Richon","Rishon","Rishon Le Tsion","ראשון לציון"],"Raanana":["Ra'anana","Ranana","Raanan","רעננה"],"Netivot":["Nativot","Netivoth","נתיבות"],"Netanya":["Natanya","Netania","Natania","נתניה"],"Haïfa":["Haifa","Hefa","Heifa","חיפה"],"Herzliya":["Herzlia","Hertzlia","Herzliyya","Hertzliya","הרצליה"],"Ashkelon":["Ashqelon","Achkelon","Ashkelone","אשקלון"],"Ashdod":["Achdod","אשדוד"],"Beer Sheva":["Beersheba","Be'er Sheva","Beer Shev'a","Beer Chev'a","Beer Cheva","באר שבע"],"Petah Tikva":["Petach Tikva","Petah Tikvah","Petach Tikvah","Petah Tiqva","פתח תקווה"],"Kfar Saba":["Kfar Sava","כפר סבא"],"Ramat Gan":["Ramat-Gan","רמת גן"],"Bat Yam":["Bat-Yam","בת ים"],"Rehovot":["Rehovoth","Rechovot","Rehovote","רחובות"],"Ness Ziona":["Nes Tsiona","Nes Ziona","Ness Tziona","Nes Tziona","נס ציונה"],"Hod Hasharon":["Hod HaSharon","הוד השרון"],"Givatayim":["Guivatayim","Givataim","Guivataim","גבעתיים"],"Givat Shmuel":["Guivat Shmuel","Givat Chmouel","גבעת שמואל"],"Tiberias":["Tibériade","Tveria","Tverya","טבריה"],"Safed":["Tsfat","Tzfat","Zefat","Safad","צפת"],"Acre":["Akko","Acco","Saint-Jean-d'Acre","Saint Jean d'Acre","עכו"],"Eilat":["Elat","Eilath","אילת"],"Zikhron Ya'akov":["Zichron Yaakov","Zikhron Yaakov","Zichron","זכרון יעקב"],"Beit Shemesh":["Bet Shemesh","Beth Shemesh","בית שמש"],"Bnei Brak":["Bne Brak","Bnei Berak","בני ברק"],"Yavne":["Yavneh","Iavne","יבנה"],"Lod":["Lydda","לוד"],"Nahariya":["Naharia","Nahariyya","נהריה"],"Ofakim":["Ofaqim","Ofakime","אופקים"],"Pardes Hanna-Karkur":["Pardes Hana","Pardes Hanna","Karkur","פרדס חנה"],"Yehud-Monosson":["Yehud","Yehoud","Monosson","יהוד"],"Mitzpe Ramon":["Mitspe Ramon","Mizpe Ramon","מצפה רמון"],"Tirat Carmel":["Tirat HaCarmel","Tirat Hakarmel","טירת כרמל"],"Giv'at Ze'ev":["Givat Zeev","Guivat Zeev","גבעת זאב"],"Hatzor HaGlilit":["Hazor HaGlilit","Hatsor","חצור הגלילית"],"Mevo Modi'im":["Modiin","Modi'in","Mevo Modiim","מבוא מודיעים"],"Kiryat Gat":["Kiriat Gat","Qiryat Gat","קריית גת"],"Kiryat Ono":["Kiriat Ono","קריית אונו"],"Kiryat Ata":["Kiriat Ata","קריית אתא"],"Kiryat Bialik":["Kiriat Bialik","קריית ביאליק"],"Kiryat Motzkin":["Kiriat Motzkin","Kiryat Motskin","קריית מוצקין"],"Kiryat Yam":["Kiriat Yam","קריית ים"],"Hadera":["Hedera","חדרה"],"Migdal HaEmek":["Migdal Haemek","מגדל העמק"],"Beer Yaakov":["Be'er Ya'akov","Beer Yaacov","באר יעקב"],"Or Yehuda":["Or Yehouda","אור יהודה"],"Even Yehuda":["Even Yehouda","אבן יהודה"],"Ramat HaSharon":["Ramat Hasharon","רמת השרון"],"Holon":["Kholon","חולון"],"Sderot":["Sdérot","שדרות"],"Dimona":["דימונה"],"Arad":["ערד"],"Gedera":["Guedera","גדרה"],"Elad":["El'ad","אלעד"],"Harish":["Kharish","חריש"],"Atlit":["Athlit","עתלית"],"Nesher":["נשר"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
 .replace(/[\u0591-\u05c7]/g,"").replace(/[^a-z0-9\u05d0-\u05ea]+/g,"");}
function phon(s){return norm(s).replace(/ch|sh|kh/g,"h").replace(/tz|ts/g,"z").replace(/q/g,"k").replace(/w/g,"v")
 .replace(/ph/g,"f").replace(/c(?=[aou])/g,"k").replace(/y/g,"i").replace(/(.)\1+/g,"$1");}
function sque(s){const p=phon(s);return p.charAt(0)+p.slice(1).replace(/[aeiou]/g,"");}
let CLES={};
function indexer(){CLES={};for(const v of new Set(D.map(l=>l.ville))){CLES[v]=[v,...(A[v]||[])].map(x=>[norm(x),phon(x),sque(x)]);}}
function dist(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];
 for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}return p[n];}
function villesPour(q){
 const n=norm(q),p=phon(q),s=sque(q);if(!n)return null;
 const ok=new Set();
 for(const v in CLES){for(const [cn,cp,cs] of CLES[v]){
  if(cn.startsWith(n)||cp.startsWith(p)||(s.length>=3&&cs.startsWith(s))||(n.length>=4&&cn.includes(n))){ok.add(v);break;}
  if(p.length>=5&&dist(p,cp.slice(0,p.length))<=(p.length>=8?2:1)){ok.add(v);break;}
 }}
 return ok;
}
function filtre(q){
 const vs=villesPour(q);if(vs===null)return null;
 const n=norm(q);
 return D.filter(l=>vs.has(l.ville)||(n.length>=3&&(norm(l.nom).includes(n)||norm(l.quartier).includes(n))));
}
function cellule(xs){return xs.map(x=>"<div>"+esc(x)+"</div>").join("");}
function lien(l){return '<a class="fiche" href="'+esc(l.lien)+'" target="_blank" rel="noopener noreferrer">Voir la fiche</a>';}
function rendre(){
 const q=$("#q").value;$("#efface").style.display=q?"block":"none";
 const r=filtre(q);
 if(r===null){
  const cpt={};D.forEach(l=>cpt[l.ville]=(cpt[l.ville]||0)+1);
  $("#accueil").innerHTML='<div class="titre-villes">'+D.length+' programmes dans '+Object.keys(cpt).length+' villes · touchez une ville</div><div class="villes">'+
   Object.keys(cpt).sort((a,b)=>a.localeCompare(b,"fr")).map(v=>'<button type="button" data-v="'+esc(v)+'">'+esc(v)+'<span>'+cpt[v]+'</span></button>').join("")+'</div>';
  $("#compteur").textContent="";$("#tableau").style.visibility="hidden";$("#corps").innerHTML="";$("#cartes").innerHTML="";return;
 }
 $("#accueil").innerHTML="";$("#tableau").style.visibility="visible";
 const vs=[...new Set(r.map(l=>l.ville))];
 $("#compteur").textContent=!r.length?"":(r.length+(r.length>1?" programmes":" programme")+(vs.length===1?" à "+vs[0]:" dans "+vs.length+" villes"));
 if(!r.length){$("#corps").innerHTML="";$("#cartes").innerHTML='<div class="vide">Aucun programme pour « '+esc(q)+' ».</div>';
  $("#tableau").style.visibility="hidden";if(innerWidth>1100)$("#accueil").innerHTML='<div class="vide">Aucun programme pour « '+esc(q)+' ».</div>';return;}
 $("#corps").innerHTML=r.map(l=>"<tr><td class=nom>"+esc(l.nom)+"</td><td class=ville>"+esc(l.ville)+"</td><td>"+esc(l.quartier)+
  "</td><td class=prox>"+cellule(l.proximite)+"</td><td>"+esc(l.typologies)+"</td><td class=prix>"+cellule(l.prix)+
  "</td><td>"+esc(l.conditions)+"</td><td class=liv>"+esc(l.livraison)+"</td><td>"+lien(l)+"</td></tr>").join("");
 const ligne=(t,v)=>v?"<dt>"+t+"</dt><dd>"+v+"</dd>":"";
 $("#cartes").innerHTML=r.map(l=>'<div class="carte"><h3>'+esc(l.nom)+'</h3><div class="lieu">'+esc(l.ville)+(l.quartier?" · "+esc(l.quartier):"")+
  "</div><dl>"+ligne("Proximité",esc(l.proximite.join(" · ")))+ligne("Typologies",esc(l.typologies))+
  ligne("Prix",'<div class="prix">'+cellule(l.prix)+"</div>")+ligne("Paiement",esc(l.conditions))+ligne("Livraison",esc(l.livraison))+
  "</dl>"+lien(l)+"</div>").join("");
}
function hauteur(){document.documentElement.style.setProperty("--haut",document.querySelector("header").offsetHeight+"px");}
$("#q").addEventListener("input",rendre);
$("#efface").addEventListener("click",()=>{$("#q").value="";rendre();$("#q").focus();});
$("#accueil").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b){$("#q").value=b.dataset.v;rendre();scrollTo(0,0);}});
addEventListener("resize",()=>{hauteur();rendre();});
const h=new URLSearchParams(location.search).get("ville");if(h)$("#q").value=h;
function demarrer(){indexer();hauteur();rendre();}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ouvrir(code){
 try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const cle=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(COFFRE.sel),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(COFFRE.iv)},cle,b64(COFFRE.ct));
  return JSON.parse(new TextDecoder().decode(clair));}catch(e){return null;}
}
async function charger(code){
 if(COFFRE){const j=await ouvrir(code);if(!j){try{localStorage.removeItem(CLE_CODE);}catch(e){}return "Code incorrect.";}
  D=j.lignes||[];$("#du").textContent=j.du||"";try{localStorage.setItem(CLE_CODE,code);}catch(e){}$("#porte").hidden=true;demarrer();return "";}
 let r;try{r=await fetch(URL_D,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({code}),cache:"no-store"});}
 catch(e){return "Connexion impossible, réessayez.";}
 if(r.status===200){const j=await r.json();D=j.lignes||[];$("#du").textContent=j.du||"";try{localStorage.setItem(CLE_CODE,code);}catch(e){}
  $("#porte").hidden=true;demarrer();$("#q").focus();return "";}
 try{localStorage.removeItem(CLE_CODE);}catch(e){}
 if(r.status===429)return "Trop d'essais. Réessayez dans quelques minutes.";
 return "Code incorrect.";
}
if(!PROTEGE){demarrer();}else{
 $("#porte").hidden=false;
 $("#fcode").addEventListener("submit",async e=>{e.preventDefault();const c=$("#code").value.trim();if(!/^[0-9]{4}$/.test(c)){$("#msg").textContent="4 chiffres.";return;}
