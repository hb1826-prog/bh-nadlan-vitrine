td.p{color:var(--or);font-weight:700;white-space:nowrap}

footer{padding:26px 16px 40px;text-align:center;color:var(--gris);font-size:12.5px}

<script>
const F = {ville:'', pieces:'', budget:'', q:''};
const eur = n => n.toLocaleString('fr-FR').replace(/ |,/g,' ') + ' ₪';
const el = document.getElementById('vue');

function typos(p){
  return p.typologies.map(t => t.libelle + ' P').join(' · ');
}
function correspond(p){
  if (F.ville && p.ville !== F.ville) return false;
  if (F.budget && p.prix_min > +F.budget) return false;
  if (F.pieces && !p.typologies.some(t => String(t.pieces) === F.pieces)) return false;
  if (F.q){
    const foin = (p.nom+' '+p.ville+' '+(p.quartier||'')).toLowerCase();
    if (!foin.includes(F.q.toLowerCase())) return false;
  }
  return true;
}
function liste(){
  const vus = DONNEES.projets.filter(correspond);
  document.getElementById('compte').textContent =
    vus.length ? vus.length + ' programme' + (vus.length>1?'s':'') +
      ' · à partir de ' + eur(Math.min(...vus.map(p=>p.prix_min)))
    : '';
  if (!vus.length){
    el.innerHTML = '<p class=vide>Aucun programme ne correspond.<br>' +
      'Dites-nous ce que vous cherchez, nous allons le chercher.</p>';
    return;
  }
  el.innerHTML = '<div class=grille>' + vus.map(p => `
    <button class=tuile onclick="ouvrir('${p.cle}')">
      <img src="${p.image}" alt="" loading=lazy onerror="this.remove()">
      <div class=txt>
        <h2>${esc(p.nom)}</h2>
        <p class=lieu>${esc(p.quartier ? p.quartier + ' · ' + p.ville : p.ville)}</p>
        <div class=puces>${p.typologies.map(t=>'<span class=puce>'+t.libelle+' pièces</span>').join('')}
          ${p.livraison ? '<span class=puce>Livraison '+esc(p.livraison)+'</span>' : ''}</div>
        <span class=prix>À partir de ${eur(p.prix_min)}</span>
      </div>
    </button>`).join('') + '</div>';
}
function ouvrir(cle){ location.hash = '#/' + cle; }
function fiche(p){
  const msg = encodeURIComponent(
    'Bonjour, je suis intéressé par le programme ' + p.nom + ' à ' + p.ville + '.');
  el.innerHTML = `
  <div class=fiche>
    <button class=retour onclick="history.back()">← Tous les programmes</button>
    <img src="${p.image}" alt="" onerror="this.remove()">
    <h1>${esc(p.nom)}</h1>
    <p class=lieu>${esc(p.quartier ? p.quartier + ' · ' + p.ville : p.ville)}${
      p.livraison ? ' · Livraison ' + esc(p.livraison) : ''}</p>
    <table><thead><tr><th>Typologie</th><th>Surface</th><th>À partir de</th></tr></thead>
    <tbody>${p.typologies.map(t => `<tr>
      <td>${t.libelle} pièces${t.parking?' · parking':''}${t.cave?' · cave':''}</td>
      <td>${surface(t)}</td><td class=p>${eur(t.prix_min)}</td></tr>`).join('')}
    </tbody></table>
    <p class=lieu>Promoteur reconnu. Prix indicatifs, susceptibles d'évolution ;
      disponibilités sous réserve. Document non contractuel.</p>
    <div class=cta>
      <a class=wa href="https://wa.me/${DONNEES.wa}?text=${msg}">Écrire sur WhatsApp</a>
      <a class=tel href="tel:+${DONNEES.wa}">Appeler BH Nadlan</a>
    </div>
  </div>`;
}
function surface(t){
  if (!t.surface_min) return '—';
  const a = Math.round(t.surface_min), b = t.surface_max ? Math.round(t.surface_max) : a;
  return (a === b ? a : a + ' à ' + b) + ' m²';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function router(){
  const cle = location.hash.replace(/^#\/?/, '');
  const p = DONNEES.projets.find(x => x.cle === cle);
  document.getElementById('barre').style.display = p ? 'none' : '';
  if (p){ fiche(p); window.scrollTo(0,0); } else { liste(); }
}
addEventListener('hashchange', router);
for (const id of ['ville','pieces','budget','q']){
  const champ = document.getElementById('f-'+id);
  champ.addEventListener('input', () => { F[id] = champ.value; liste(); });
}
router();
</script>
</body></html>
