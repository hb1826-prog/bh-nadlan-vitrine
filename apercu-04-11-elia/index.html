    <div class="qui">
      <div class="nom">EliA</div>
      <div class="sous"><i></i>Votre conseiller IA</div>
    </div>
    <button class="conseiller" type="button" id="conseiller">Parler à un conseiller</button>
  </header>
  <div class="fil" id="fil" aria-live="polite"></div>
  <footer>
    <form id="saisie">
      <textarea id="texte" rows="1" maxlength="600" placeholder="Écrivez votre message…" aria-label="Votre message"></textarea>
      <button id="envoyer" type="submit" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <p class="mention">EliA est une intelligence artificielle. Chiffres indicatifs, sans valeur de conseil personnalisé.</p>
  </footer>
</div>
<script>
(function () {
  'use strict';
  const ACCUEIL = 'Bonjour, je suis EliA, le conseiller IA de BH Nadlan. Racontez-moi votre projet en Israël, je vous pose quelques questions, je réponds aux vôtres (frais, taxe d’achat, crédit…) et je vous fais de petites simulations au fil de la discussion. Pour commencer : c’est pour y habiter, pour investir, ou les deux ?';
  const SUGG0 = ['Pour y habiter', 'Pour investir', 'Les deux'];
  const fil = document.getElementById('fil'), champ = document.getElementById('texte'),
        bouton = document.getElementById('envoyer');
  let D = null, attente = false;
  const S = JSON.parse(sessionStorage.getItem('elia-conv') || 'null') || {
    cid: Array.from(crypto.getRandomValues(new Uint8Array(12)), b => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join(''),
    etapes: [{t: 'lui', v: ACCUEIL, sugg: SUGG0}], montres: [], demandes: 0, lead: false,
    derniere_demande: false, qualif: null, ecrits: []};
  const garder = () => sessionStorage.setItem('elia-conv', JSON.stringify(S));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const milliers = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const sansSuggestions = t => { const i = t.indexOf('§'); return (i < 0 ? t : t.slice(0, i)).trim(); };

  function carte(k) {
    const p = D && D.projets[k];
    if (!p) return '';
    const pcs = p.pieces || [];
    const typo = pcs.length > 1 ? pcs[0] + ' à ' + pcs[pcs.length - 1] + ' pièces' : (pcs[0] ? pcs[0] + ' pièces' : '');
    const prix = p.sur_demande || !p.prix_min ? '<small>Prix</small> sur demande'
      : '<small>à partir de</small> ' + milliers(p.prix_min) + ' ₪' + (D.eur ? ' <small>(' + milliers(p.prix_min / D.eur) + ' €)</small>' : '');
    const lieu = p.quartier ? p.quartier + ' · ' + p.ville : p.ville;
    const c = [typo, p.livraison ? 'Livraison ' + p.livraison : ''].filter(Boolean).join(' · ');
    return `<a class="carte" href="https://biens.bh-nadlan.com/annuaire/#/${esc(k)}" target="_blank" rel="noopener">
      <span class="photo" style="background-image:url('${esc(p.image || '')}')"></span>
      <span class="corps"><span class="n">${esc(p.nom)}</span><span class="l">${esc(lieu)}</span>
      <span class="p">${prix}</span><span class="c">${esc(c)}</span></span></a>`;
  }

  function formulaire(e, i) {
    if (S.lead) return '';
    return `<div class="form" data-i="${i}">
      <div class="ligne"><input id="f-nom" autocomplete="family-name" placeholder="Nom" value="">
        <input id="f-prenom" autocomplete="given-name" placeholder="Prénom" value=""></div>
      <div class="ligne"><select id="f-ind" aria-label="Indicatif">
          <option value="+33">🇫🇷 +33</option><option value="+972">🇮🇱 +972</option><option value="+32">🇧🇪 +32</option>
          <option value="+41">🇨🇭 +41</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option>
          <option value="+">Autre</option></select>
        <input id="f-tel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Téléphone" value="${esc(e.tel || '')}"></div>
      <button class="ok" type="button">Recevoir le détail sur WhatsApp</button>
      <button class="wa" type="button">Écrire directement sur WhatsApp</button>
      <p class="note">Un conseiller BH Nadlan vous écrit avec les lots disponibles, les prix réels et votre simulation complète.</p>
    </div>`;
  }

  function dessiner() {
    let h = '';
    S.etapes.forEach((e, i) => {
      const dernier = i === S.etapes.length - 1;
      if (e.t === 'moi') h += `<div class="msg moi">${esc(e.v)}</div>`;
      if (e.t === 'lui') {
        if (e.v) h += `<div class="msg lui">${esc(e.v)}</div>`;
        if (e.cartes && e.cartes.length) h += `<div class="cartes">${e.cartes.map(carte).join('')}</div>`;
        if (e.form) h += formulaire(e.form, i);
        if (dernier && !attente && e.sugg && e.sugg.length)
          h += '<div class="sugg">' + e.sugg.slice(0, 3).map(s => `<button type="button">${esc(s)}</button>`).join('') + '</div>';
      }
      if (e.t === 'merci') h += `<div class="merci">Merci ! Un conseiller BH Nadlan vous écrit sur WhatsApp.</div>`;
    });
    if (attente) h += '<div class="ecrit" id="ecrit"><span></span><span></span><span></span></div>';
    fil.innerHTML = h;
    fil.querySelectorAll('.sugg button').forEach(b => b.onclick = () => envoyer(b.textContent));
    fil.querySelectorAll('.form').forEach(brancher);
    fil.scrollTop = 1e9;
  }

  function resume() {
    const l = ['Demande via EliA (aperçu conversation)'];
    if (S.ecrits.length) l.push('A écrit : « ' + S.ecrits.join(' / ') + ' »');
    const vus = S.montres.map(k => D && D.projets[k] && (D.projets[k].nom + ' (' + D.projets[k].ville + ')')).filter(Boolean);
    if (vus.length) l.push('Programmes vus : ' + vus.join(', '));
    return l.join('\n');
  }

  function brancher(f) {
    const note = f.querySelector('.note');
    const numero = () => {
      const t = f.querySelector('#f-tel').value.trim().replace(/[^\d+]/g, '');
      if (/^\+/.test(t)) return t;
      const ind = f.querySelector('#f-ind').value;
      return ind === '+' ? '' : ind + t.replace(/^0/, '');
    };
    f.querySelector('.wa').onclick = () => {
      window.open('https://wa.me/' + D.wa + '?text=' + encodeURIComponent(resume()), '_blank');
    };
    f.querySelector('.ok').onclick = async (ev) => {
      const nom = f.querySelector('#f-nom').value.trim(), prenom = f.querySelector('#f-prenom').value.trim();
      const tel = numero();
      if (!nom || !prenom || tel.replace(/\D/g, '').length < 8) {
        note.textContent = !nom || !prenom ? 'Il me faut votre nom et votre prénom pour que le conseiller puisse vous écrire.'
          : 'Il me faut votre numéro pour que le conseiller puisse vous écrire.';
        note.classList.add('manque');
        return;
      }
      const b = ev.currentTarget; b.disabled = true; b.textContent = 'Envoi…';
      const q = S.qualif || {}, p0 = S.montres[0] && D.projets[S.montres[0]];
      try {
        const r = await fetch(D.guichet + '/lead', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prenom, nom, tel, mail: '', mot: resume(), societe: '',
            projet: p0 ? p0.nom + ' — ' + p0.ville : '', ville: p0 ? p0.ville : '',
            budget: '', page: 'EliA · aperçu conversation', apport: q.apport || '',
            profil: q.profil || '', emprunt_pct: q.emprunt_pct != null ? q.emprunt_pct : '',
            emprunt_duree: q.emprunt_duree != null ? q.emprunt_duree : '', eid: String(Date.now())})});
        if (!r.ok) throw new Error('guichet');
        S.lead = true;
        S.etapes.push({t: 'merci'});
        garder(); dessiner();
      } catch (e) {
        b.disabled = false; b.textContent = 'Recevoir le détail sur WhatsApp';
        window.open('https://wa.me/' + D.wa + '?text=' + encodeURIComponent(resume() + '\nTéléphone : ' + tel), '_blank');
      }
    };
  }

  function envoyer(texte) {
    texte = String(texte || '').trim().slice(0, 600);
    if (!texte || attente || !D) return;
    S.etapes.push({t: 'moi', v: texte});
    S.ecrits = S.ecrits.concat([texte]).slice(-8);
    attente = true; garder(); dessiner();
    champ.value = ''; ajuster();
    const etat = {montres: S.montres, demandes: S.demandes, lead: S.lead, derniere_demande: S.derniere_demande};
    const fin = new AbortController(), delai = setTimeout(() => fin.abort(), 40000);
    let bulle = null, flux = '', cartesFlux = null;
    fetch(D.eli_url, {method: 'POST', headers: {'Content-Type': 'application/json'}, signal: fin.signal,
      body: JSON.stringify({cid: S.cid, langue: 'fr', texte, etat, variante: 'conversation'})})
      .then(r => {
        if (!r.ok || !r.body) return {mode: 'guide'};
        const lecteur = r.body.getReader(), dec = new TextDecoder();
        let tampon = '';
        const lire = () => lecteur.read().then(({done, value}) => {
          if (done) return {mode: 'guide'};
          tampon += dec.decode(value, {stream: true});
          const blocs = tampon.split('\n\n'); tampon = blocs.pop();
          for (const bloc of blocs) {
            const l = bloc.split('\n').find(x => x.startsWith('data: '));
            if (!l) continue;
            let e; try { e = JSON.parse(l.slice(6)); } catch (_) { continue; }
            if (e.delta != null) {
              flux += e.delta;
              const vu = sansSuggestions(flux);
              if (vu) {
                if (!bulle) {
                  const ec = document.getElementById('ecrit'); if (ec) ec.remove();
                  fil.insertAdjacentHTML('beforeend', '<div class="msg lui" id="flux"></div>');
                  bulle = document.getElementById('flux');
                }
                bulle.textContent = vu; fil.scrollTop = 1e9;
              }
            } else if (e.cartes) {
              if (cartesFlux) cartesFlux.remove();
              fil.insertAdjacentHTML('beforeend', '<div class="cartes" id="cartes-flux">' + e.cartes.map(carte).join('') + '</div>');
              cartesFlux = document.getElementById('cartes-flux'); fil.scrollTop = 1e9;
            } else if (e.final) return e.final;
          }
          return lire();
        });
        return lire();
      })
      .catch(() => ({mode: 'guide'}))
      .then(r => {
        clearTimeout(delai);
        attente = false;
        if (!r || r.mode !== 'ia') {
          S.etapes.push({t: 'lui', v: 'Je rencontre un petit souci technique. Un conseiller BH Nadlan peut vous répondre tout de suite sur WhatsApp, ou vous pouvez réessayer dans un instant.', form: {}});
        } else {
          const e = {t: 'lui', v: r.texte || '', sugg: r.suggestions || []};
          if (r.cartes && r.cartes.length) {
            e.cartes = r.cartes;
            S.montres = S.montres.concat(r.cartes.filter(k => S.montres.indexOf(k) < 0));
          }
          if (r.formulaire) { e.form = {tel: r.formulaire.telephone || ''}; S.demandes++; }
          S.derniere_demande = !!r.formulaire;
          if (r.qualif) S.qualif = r.qualif;
          S.etapes.push(e);
        }
        garder(); dessiner();
      });
  }

  function ajuster() { champ.style.height = 'auto'; champ.style.height = Math.min(champ.scrollHeight, 120) + 'px'; bouton.disabled = !champ.value.trim(); }
  champ.addEventListener('input', ajuster);
  champ.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyer(champ.value); } });
  document.getElementById('saisie').onsubmit = e => { e.preventDefault(); envoyer(champ.value); };
  document.getElementById('conseiller').onclick = () => envoyer('Je voudrais parler à un conseiller');
  ajuster();
  fetch('projets.json?v=' + Date.now()).then(r => r.json()).then(d => { D = d; dessiner(); });
  dessiner();
})();
</script>
</body>
</html>
